name: pferdekalender
description: "Pferdekalender – lokal, offline"
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: ^3.14.0

dependencies:
  archive: ^4.7.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/training_templates.json
    - assets/blood_reference.json
  # Im Web gebündelt, damit keine Schriften von Google-Servern geladen werden.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
